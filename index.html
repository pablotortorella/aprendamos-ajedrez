<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Defensa en profundidad, no una vulnerabilidad puntual: esta app no
         carga nada de terceros (fuentes autohospedadas, sin backend, sin
         CDN), así que un CSP estricto no le saca funcionalidad a cambio de
         cerrar la puerta a scripts/estilos/imágenes inyectados desde afuera.
         style-src necesita 'unsafe-inline' porque la app usa style={{}} de
         React en vez de sólo clases (son atributos style="" reales en el
         HTML final, y CSP los trata distinto de un <script> inline).
         frame-ancestors no va: por spec, un <meta> lo ignora en silencio (sólo
         funciona como header HTTP, que GitHub Pages no deja mandar); ponerlo
         acá daría una falsa sensación de protección contra clickjacking. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#164E53" />
    <meta
      name="description"
      content="El Cartero de Ajedrez: aprendé la notación algebraica española jugando, para escribir tus jugadas por correspondencia."
    />
    <title>El Cartero de Ajedrez</title>

    <!-- Open Graph / Twitter Card: a diferencia del resto del build (base: "./",
         para andar servido desde cualquier subcarpeta), estas URLs van
         absolutas a propósito — los scrapers de WhatsApp/redes que arman la
         vista previa al compartir el link no resuelven rutas relativas. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="El Cartero de Ajedrez" />
    <meta
      property="og:description"
      content="Aprendé la notación algebraica y jugá al ajedrez por correspondencia con quien quieras."
    />
    <meta property="og:url" content="https://pablotortorella.github.io/aprendamos-ajedrez/" />
    <meta property="og:image" content="https://pablotortorella.github.io/aprendamos-ajedrez/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="El Cartero de Ajedrez" />
    <meta
      name="twitter:description"
      content="Aprendé la notación algebraica y jugá al ajedrez por correspondencia con quien quieras."
    />
    <meta name="twitter:image" content="https://pablotortorella.github.io/aprendamos-ajedrez/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
